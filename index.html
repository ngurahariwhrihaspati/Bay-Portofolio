<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Landing Page — Tailwind CSS</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.0.2/tailwind.min.css"
    />
    <style>
      /* Mobile-first responsive tweaks for #about */
      @media screen and (max-width: 767px) {
        #about .container {
          padding-top: 1.25rem;
          padding-bottom: 4.5rem;
        }
        #about .about-footer {
          position: static;
          display: flex;
          justify-content: space-between;
          padding: 0.75rem 1rem;
        }
        #about img {
          max-height: 360px;
          width: 100%;
          height: auto;
          object-fit: cover;
        }
        #about .space-y-6 a span {
          font-size: 0.95rem;
        }
      }
      /* keep absolute footer on medium+ screens */
      @media screen and (min-width: 768px) {
        #about .about-footer {
          position: absolute;
          left: 0;
          right: 0;
          bottom: 0;
        }
      }
    </style>
  </head>

  <body>
    <header
      class="sticky top-0 z-50 text-white body-font bg-black border-b border-gray-900"
    >
      <div
        class="container mx-auto flex flex-wrap p-5 flex-col md:flex-row items-center"
      >
        <a
          class="flex title-font font-medium items-center text-white mb-4 md:mb-0"
          href="https://tailblocks.cc"
          target="_blank"
        >
          <span class="ml-3 text-xl">Bayu Ariwiguna</span>
        </a>
        <nav
          class="md:ml-auto flex flex-wrap items-center text-base justify-center"
        >
          <a class="mr-5 text-white hover:text-gray-300" href="#about">About</a>
          <a class="mr-5 text-white hover:text-gray-300" href="#gallery"
            >Gallery</a
          >
          <a class="mr-5 text-white hover:text-gray-300" href="#contact"
            >Contact</a
          >
        </nav>
      </div>
    </header>

    <section class="text-gray-700 body-font">
      <div class="w-full flex items-center justify-center">
        <div class="w-full">
          <img
            class="object-cover object-center rounded"
            alt="hero"
            src="cover.png"
          />
        </div>
      </div>
    </section>

    <section
      id="about"
      class="text-gray-700 body-font border-t border-gray-200"
    >
      <div
        class="container px-5 pt-20 pb-32 mx-auto bg-black relative text-white"
      >
        <div class="flex flex-wrap -m-4">
          <div class="p-4 md:w-1/3 flex items-end justify-start">
            <h1 class="text-red-600 font-bold uppercase text-2xl">Content</h1>
          </div>

          <div class="p-12 md:w-1/3 text-white">
            <div class="space-y-6">
              <a
                href="#about"
                class="flex items-center justify-between border-b border-white/20 pb-4"
              >
                <span class="text-xl uppercase tracking-[0.2em]">About Me</span>
                <span class="text-2xl font-semibold">01</span>
              </a>
              <a
                href="#creative-flow"
                class="flex items-center justify-between border-b border-white/20 pb-4"
              >
                <span class="text-xl uppercase tracking-[0.2em]"
                  >Creative Flow</span
                >
                <span class="text-2xl font-semibold">02</span>
              </a>
              <a
                href="#experience"
                class="flex items-center justify-between border-b border-white/20 pb-4"
              >
                <span class="text-xl uppercase tracking-[0.2em]"
                  >Experience</span
                >
                <span class="text-2xl font-semibold">03</span>
              </a>
              <a
                href="#projects"
                class="flex items-center justify-between border-b border-white/20 pb-4"
              >
                <span class="text-xl uppercase tracking-[0.2em]">Projects</span>
                <span class="text-2xl font-semibold">04</span>
              </a>
              <a href="#contact" class="flex items-center justify-between">
                <span class="text-xl uppercase tracking-[0.2em]">Contact</span>
                <span class="text-2xl font-semibold">05</span>
              </a>
            </div>
          </div>

          <div class="p-4 md:w-1/3">
            <img
              alt="about"
              class="rounded-lg h-full w-full object-cover object-center"
              src="about.png"
            />
          </div>
          <div
            class="absolute left-0 right-0 bottom-0 px-8 py-6 flex items-center justify-between text-white about-footer"
          >
            <div class="text-sm md:text-base">
              Creative Manager | Direct &amp; Shoot
            </div>
            <div class="text-sm md:text-base">2026</div>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
